<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="beninGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008751" />
      <stop offset="100%" stop-color="#00663d" />
    </linearGradient>
    <linearGradient id="beninYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD116" />
      <stop offset="100%" stop-color="#E5BC0F" />
    </linearGradient>
    <linearGradient id="beninRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8112D" />
      <stop offset="100%" stop-color="#BF0D24" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer road border ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.15" stroke-dasharray="24 16" />

  <!-- Road badge plate -->
  <circle cx="256" cy="256" r="150" fill="#ffffff" />
  <circle cx="256" cy="256" r="136" fill="#1e3a8a" />

  <!-- Letter B & Steering wheel accent -->
  <path d="M210 160 H270 C295 160 310 172 310 192 C310 208 298 220 280 224 C304 228 318 242 318 266 C318 292 298 308 268 308 H210 V160 Z M244 192 V220 H266 C276 220 282 214 282 206 C282 198 276 192 266 192 H244 Z M244 248 V276 H270 C280 276 288 270 288 262 C288 254 280 248 270 248 H244 Z" fill="#ffffff" />

  <!-- Benin flag ribbon badge at bottom -->
  <g transform="translate(186, 360)">
    <rect x="0" y="0" width="46" height="40" rx="6" fill="url(#beninGreen)" />
    <rect x="46" y="0" width="47" height="20" rx="3" fill="url(#beninYellow)" />
    <rect x="46" y="20" width="47" height="20" rx="3" fill="url(#beninRed)" />
    <rect x="0" y="0" width="140" height="40" rx="6" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
  </g>

  <!-- Stars / Success indicators -->
  <polygon points="256,58 263,74 280,74 266,84 271,100 256,90 241,100 246,84 232,74 249,74" fill="#FCD116" />
</svg>